name: Authentication Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run fast tests
        run: pytest -m "not crypto"

  full-validation:
    needs: fast-check # only runs if fast-check succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run full test suite
        run: pytest
